# Dokploy spike / pre-production deployment (tasks 1.4 and 4.1).
#
# Deploys the production relay unchanged (included below) plus:
#   ag-auth-stub        stub of the web app: ForwardAuth target (/auth/media) and a
#                       test player page on https://${APP_HOST}/ (until the real
#                       app exists; it replaces nothing in production)
#   ag-sink-a, ag-sink-b  RTMP sinks standing in for YouTube A and B
#
# Dokploy: Compose app, type "Docker Compose", compose path
# ./relay/docker-compose.spike.yml, environment as in .env.example with:
#   YOUTUBE_URL_A=rtmp://ag-sink-a:1935/live
#   YOUTUBE_URL_B=rtmp://ag-sink-b:1935/live
#   RELAY_AUTH_URL=http://ag-auth-stub:8000/auth/media
# Switch the compose path to ./relay/docker-compose.yml for production.

include:
  - docker-compose.yml

services:
  ag-auth-stub:
    # Files are baked into an image rather than bind-mounted: Dokploy re-clones
    # the repo on each deploy, which leaves bind mounts of unchanged containers
    # pointing at a deleted directory.
    build:
      context: ./test
      dockerfile_inline: |
        FROM python:3.13-alpine
        COPY app-stub.py reader.js /stub/
        CMD ["python", "-u", "/stub/app-stub.py"]
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Catch-all for the host, below the WHEP router (priority 1000).
      - "traefik.http.routers.ag-stub.rule=Host(`${APP_HOST:?set APP_HOST}`)"
      - traefik.http.routers.ag-stub.priority=1
      - traefik.http.routers.ag-stub.entrypoints=websecure
      - traefik.http.routers.ag-stub.tls.certresolver=letsencrypt
      - traefik.http.routers.ag-stub.service=ag-stub
      - "traefik.http.routers.ag-stub-http.rule=Host(`${APP_HOST}`)"
      - traefik.http.routers.ag-stub-http.priority=1
      - traefik.http.routers.ag-stub-http.entrypoints=web
      - traefik.http.routers.ag-stub-http.middlewares=redirect-to-https@file
      - traefik.http.routers.ag-stub-http.service=ag-stub
      - traefik.http.services.ag-stub.loadbalancer.server.port=8000

  ag-sink-a:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    networks:
      - dokploy-network

  ag-sink-b:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    networks:
      - dokploy-network
