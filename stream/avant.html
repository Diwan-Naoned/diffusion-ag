<!doctype html>
<html lang="br">
<head>
<meta charset="utf-8">
<title>Avant</title>
<!-- URL: avant.html?start=HH:MM (announced start time, Mac local time) -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  .root { background: var(--surface); }

  .intro { position: absolute; left: 120px; top: 112px; width: 820px; display: flex; flex-direction: column; }
  .network { font: 400 34px/1.2 var(--font-display); letter-spacing: 0.02em; color: var(--brand); }
  .title-br { margin: 24px 0 0; font: 900 88px/1 var(--font-headline); color: var(--brand); }
  .accent-rule { width: 200px; height: 10px; border-radius: var(--radius-pill); background: var(--accent); margin: 28px 0 24px; }
  .title-fr { margin: 0; font: italic 400 48px/1.1 var(--font-headline); color: var(--brand); }
  .date-br { margin: 28px 0 0; font: 700 36px/1.3 var(--font-headline); color: var(--ink); }
  .date-fr { margin: 2px 0 0; font: italic 400 32px/1.3 var(--font-headline); color: var(--ink); }

  .countdown { position: absolute; left: 120px; top: 640px; display: flex; flex-direction: column; gap: 4px; }
  .countdown .br { font: 700 36px/1.2 var(--font-headline); color: var(--brand); }
  .countdown .fr { font: italic 400 30px/1.2 var(--font-headline); color: var(--ink); }
  .clock { font: 900 128px/1 var(--font-headline); color: var(--brand); margin-top: 8px; }

  .panel {
    position: absolute;
    left: 1040px;
    top: 96px;
    width: 784px;
    height: 888px;
    box-sizing: border-box;
    padding: 56px;
    background: var(--brand);
    border-radius: var(--radius-lg) 0 var(--radius-lg) 0;
    color: var(--on-brand);
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .panel-head { display: flex; flex-direction: column; gap: 6px; }
  .panel-head .br { font: 700 34px/1.2 var(--font-headline); }
  .panel-head .fr { font: italic 400 28px/1.2 var(--font-headline); }
  .rules { display: flex; flex-direction: column; gap: 18px; }
  .rule-item { height: 80px; display: flex; gap: 28px; align-items: center; }
  .num {
    flex: 0 0 auto;
    width: 68px;
    height: 68px;
    border-radius: var(--radius-pill);
    background: var(--accent);
    color: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    font: 900 38px/1 var(--font-headline);
  }
  .rule-item .lines { display: flex; flex-direction: column; gap: 4px; }
  .rule-item .br { font: 700 38px/1.05 var(--font-headline); }
  .rule-item .fr { font: italic 400 28px/1.15 var(--font-headline); }
  .characters { margin-top: auto; display: flex; justify-content: flex-end; }
  .characters img { width: 320px; height: auto; display: block; }
</style>
</head>
<body>
<div class="root">
  <div class="intro">
    <div class="network rise" data-text="network"></div>
    <h1 class="title-br br rise d1" data-text="title.br"></h1>
    <div class="accent-rule rule"></div>
    <p class="title-fr fr rise d2" data-text="title.fr"></p>
    <p class="date-br br rise d3" data-text="date.br"></p>
    <p class="date-fr fr rise d3" data-text="date.fr"></p>
  </div>

  <div class="countdown rise d4">
    <div class="br" data-text="startsIn.br"></div>
    <div class="fr" data-text="startsIn.fr"></div>
    <div class="clock tabular" id="clock">--:--</div>
  </div>

  <div class="panel fade d1">
    <div class="panel-head">
      <div class="br" data-text="rulesTitle.br"></div>
      <div class="fr" data-text="rulesTitle.fr"></div>
    </div>
    <div class="rules" id="rules"></div>
    <div class="characters">
      <img class="float" src="img/diwan-bolomig.svg" alt="" aria-hidden="true">
    </div>
  </div>
</div>
<template id="rule">
  <div class="rule-item rise">
    <div class="num"></div>
    <div class="lines"><div class="br"></div><div class="fr"></div></div>
  </div>
</template>
<script src="texts.js"></script>
<script src="common.js"></script>
<script>
  fillTexts();
  var list = document.getElementById('rules');
  var tpl = document.getElementById('rule');
  TEXTS.rules.forEach(function (r, i) {
    var node = tpl.content.cloneNode(true);
    // The rules appear one after the other, after the title.
    node.querySelector('.rule-item').style.animationDelay = 700 + i * 150 + 'ms';
    node.querySelector('.num').textContent = i + 1;
    node.querySelector('.br').textContent = r.br;
    node.querySelector('.fr').textContent = r.fr;
    list.appendChild(node);
  });
  startCountdown(document.getElementById('clock'));
</script>
</body>
</html>
